<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private Chat</title>
  <!-- Font Awesome for clean, reliable UI icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="chat-container">
    <!-- Header -->
    <header class="chat-header">
      <div class="title">
        <i class="fa-solid fa-seedling"></i>
        <h2>Private Chat</h2>
      </div>
      <button id="theme-toggle" class="icon-btn">
        <i class="fa-solid fa-sun"></i>
      </button>
    </header>

    <!-- Online Status Section -->
    <section class="online-status">
      <div class="status-indicator">
        <span class="dot green"></span>
        <span>Online: <strong id="online-count">0</strong></span>
      </div>
      <button id="toggle-users-btn" class="text-btn">
        <i id="user-list-arrow" class="fa-solid fa-chevron-down"></i>
        <span>Show Online Users</span>
      </button>
      <div id="users-list" class="users-list hidden"></div>
    </section>

    <!-- Chat Messages Container -->
    <section id="chat-messages" class="chat-messages"></section>

    <!-- Footer Controls -->
    <footer class="chat-footer">
      <div class="input-wrapper">
        <input type="text" placeholder="Message..." id="message-input" autocomplete="off" />
        <button id="send-btn" class="send-btn">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </div>
      <div class="media-actions">
        <input type="file" id="file-input" style="display: none;" />
        <button id="upload-btn" class="action-btn">
          <i class="fa-solid fa-paperclip"></i> Upload
        </button>
        <button id="voice-btn" class="action-btn">
          <i class="fa-solid fa-phone"></i> Voice
        </button>
        <button id="video-btn" class="action-btn">
          <i class="fa-solid fa-video"></i> Video
        </button>
      </div>
    </footer>
  </div>

  <!-- Video Call Floating Overlay -->
  <div id="call-popup" class="call-popup">
    <div class="video-preview">
      <video id="remote-video" autoplay playsinline class="remote-video"></video>
      <video id="local-video" autoplay playsinline muted class="local-video"></video>
    </div>
    <div class="call-controls">
      <button id="mic-btn" class="call-btn"><i class="fa-solid fa-microphone"></i></button>
      <button id="cam-btn" class="call-btn"><i class="fa-solid fa-video"></i></button>
      <button id="fullscreen-btn" class="call-btn"><i class="fa-solid fa-expand"></i></button>
      <button id="end-call-btn" class="call-btn end-call"><i class="fa-solid fa-phone-slash"></i></button>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script src="/static/script.js"></script>
</body>
</html>
