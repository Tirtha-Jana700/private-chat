<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0b1020">
  <title>Private Chat Room ✨</title>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

    :root{
      --day-bg: url('https://ik.imagekit.io/mrg7wer1a/a0064ace5b8acab961e5f6fc4ec005eb.jpg?updatedAt=1754334087427');
      --night-bg: url('https://ik.imagekit.io/mrg7wer1a/d51cb81754b0f48eee0866b8e9662ac5.jpg?updatedAt=1754334077449');
      --accent:#a5d8ff;
      --accent-2:#d8b4fe;
      --text:#ffffff;
      --muted: rgba(255,255,255,.72);
      --glass-border: rgba(255,255,255,.28);
      --input-bg: rgba(255,255,255,.12);
      --btn: linear-gradient(135deg, #7b78ff 0%, #9e7aff 100%);
      --btn-hover: linear-gradient(135deg, #8c89ff 0%, #ad8bff 100%);
      --radius:26px;
      --shadow:0 20px 50px rgba(0,0,0,.45);
      --veil: linear-gradient(180deg, rgba(6,10,25,.30), rgba(6,10,25,.58));
    }

    html, body{
      height:100%; font-family:'Raleway',sans-serif; color:var(--text);
      overflow-x:hidden; -webkit-font-smoothing:antialiased;
    }
    body{
      display:flex; flex-direction:column; padding:10px;
      background: var(--day-bg) center/cover no-repeat fixed;
      transition: background .8s ease;
    }
    body::before{
      content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
      background: radial-gradient(60% 45% at 15% 10%, rgba(122,162,255,.25), transparent 60%),
                  radial-gradient(55% 45% at 90% 85%, rgba(216,180,254,.24), transparent 60%),
                  var(--veil);
    }
    html.dark-mode, body.dark-mode{ background: var(--night-bg) center/cover no-repeat fixed !important; }
    body.dark-mode::before{
      background: radial-gradient(60% 45% at 15% 10%, rgba(122,162,255,.22), transparent 60%),
                  linear-gradient(180deg, rgba(3,6,18,.45), rgba(3,6,18,.72));
    }

    .chat-container{
      position:relative; z-index:1; width:100%; max-width:620px; margin:auto;
      padding:1.4rem; display:flex; flex-direction:column;
      height:calc(100vh - 20px); max-height:920px; border-radius:var(--radius);
      background:linear-gradient(160deg, rgba(255,255,255,.17), rgba(255,255,255,.06));
      border:1px solid var(--glass-border); backdrop-filter: blur(26px) saturate(180%);
      box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.32);
    }
    body.dark-mode .chat-container{
      background:linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
      border-color:rgba(255,255,255,.18);
    }

    .top-bar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; flex-shrink:0; }
    h2{ font-size:1.25rem; font-weight:700; background:linear-gradient(90deg,#ffffff,#a5d8ff 60%,#d8b4fe); -webkit-background-clip:text; color:transparent; }
    .theme-toggle{
      background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.22);
      font-size:1.2rem; cursor:pointer; transition:transform .5s ease; width:44px; height:44px;
      border-radius:14px; display:flex; align-items:center; justify-content:center;
      backdrop-filter: blur(10px); color:#fff;
    }
    .theme-toggle:hover{ transform:rotate(180deg); background:rgba(255,255,255,.2); }

    #onlineInfo{ margin-bottom:.9rem; padding:.8rem 1rem; flex-shrink:0; font-size:.88rem; border-radius:16px; background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.18); backdrop-filter: blur(10px); }
    details{ margin-top:.5rem; }
    summary{ cursor:pointer; color:var(--muted); font-size:.82rem; user-select:none; }
    #userList{ list-style:none; margin:.5rem 0 0 .25rem; padding:0; display:flex; flex-wrap:wrap; gap:6px; }
    #userList li{ padding:.25rem .7rem; font-size:.8rem; border-radius:999px; color:rgba(255,255,255,.85); background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.18); }
    #userList li.current-user{ font-weight:700; color:#0b1020; background:var(--accent); border-color:transparent; }

    #messages{
      flex:1; overflow-y:auto; overflow-x:hidden; word-break:break-word; padding:1rem;
      margin-bottom:.7rem; border-radius:20px; border:1px solid rgba(255,255,255,.16);
      background:rgba(10,14,30,.24); backdrop-filter: blur(12px); -webkit-overflow-scrolling:touch;
    }
    #messages::-webkit-scrollbar{ width:6px; }
    #messages::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.22); border-radius:999px; }

    .msg{ margin:.55rem 0; padding:.15rem 0; animation:fadeInMsg .3s ease; }
    @keyframes fadeInMsg{ from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }
    .msg strong{ color:var(--accent); font-weight:600; font-size:.85rem; }
    
    .msg-content {
      background: rgba(255, 255, 255, 0.12);
      padding: 10px 14px;
      border-radius: 14px;
      margin-top: 4px;
      display: inline-block;
      max-width: 90%;
    }

    .msg img {
      max-width: 100%;
      max-height: 250px;
      object-fit: contain;
      border-radius: 12px;
      margin-top: .4rem;
      display: block;
      cursor: pointer;
    }

    .msg audio {
      width: 100%;
      min-width: 240px;
      max-width: 100%;
      border-radius: 12px;
      margin-top: .4rem;
      display: block;
    }

    .msg video {
      max-width: 100%;
      max-height: 250px;
      border-radius: 12px;
      margin-top: .4rem;
      display: block;
    }

    .shared-link{ color:var(--accent); text-decoration:underline; word-break:break-all; cursor:pointer; }

    .system-msg { text-align: center; font-style: normal; font-size: 0.85rem; color: #a5d8ff; background: rgba(255, 255, 255, 0.08); padding: 8px 12px; border-radius: 12px; margin:.6rem auto; max-width: 85%; border: 1px solid rgba(165, 216, 255, 0.2); }

    .composer{ flex-shrink:0; display:flex; flex-direction:column; gap:10px; padding:10px; border-radius:22px; background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.18); backdrop-filter: blur(14px) saturate(160%); }
    .input-row{ display:flex; gap:8px; align-items:stretch; width:100%; }
    
    input[type="text"]{ flex:1 1 auto; min-width:0; height:46px; padding:0 1rem; -webkit-appearance:none; appearance:none; border:1px solid rgba(255,255,255,.22); border-radius:16px; font-size:0.9rem; font-family:'Raleway',sans-serif; background:var(--input-bg); color:#fff; outline:none; transition:all .3s ease; backdrop-filter: blur(8px); }
    input[type="text"]:focus{ border-color:var(--accent); background:rgba(255,255,255,.2); box-shadow:0 0 0 4px rgba(165,216,255,.16); }
    input::placeholder{ color:rgba(255,255,255,.55); }

    #sendBtn{ width:46px; height:46px; min-width:46px; flex:0 0 46px; border-radius:16px; display:flex; align-items:center; justify-content:center; background:var(--btn); border:none; cursor:pointer; color:#fff; transition:all .3s ease; }
    #sendBtn:hover{ background:var(--btn-hover); transform:translateY(-2px); }

    .action-row{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; align-items:stretch; }
    .action-row button, .action-row label{ width:100%; display:flex; align-items:center; justify-content:center; min-width:46px; min-height:46px; padding:.7rem; background:var(--btn); border:none; border-radius:16px; cursor:pointer; color:#fff; transition:all .3s ease; }
    .action-row button:hover, .action-row label:hover{ background:var(--btn-hover); transform:translateY(-2px); }
    .action-row .btn-label{ font-size:.85rem; font-weight:600; letter-spacing:.2px; }
    .action-row .fas{ margin-right:6px; }
    #file{ display:none; }

    #progressContainer{ padding:1rem; flex-shrink:0; border-radius:18px; border:1px solid rgba(255,255,255,.18); background:rgba(10,14,30,.88); backdrop-filter: blur(14px); display:none; margin-bottom:0.7rem; max-height: 180px; overflow-y: auto; position: relative; }
    .upload-item { margin-bottom:10px; padding:10px; border-radius:12px; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); position:relative; }
    .upload-info { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-size:.85rem; }
    .upload-name { color:var(--muted); font-weight:500; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-right:8px; }
    .upload-percent { color:var(--accent); font-weight:600; margin-left:8px; min-width:35px; text-align:right; }
    .progress-bar-wrapper{ width:100%; height:12px; border-radius:999px; overflow:hidden; background:rgba(255,255,255,.12); position:relative; }
    .progress-bar{ height:100%; width:0%; border-radius:999px; background:linear-gradient(90deg,#8ec5fc,#e0c3fc); transition:width .3s ease; }
    .upload-status { font-size:.8rem; margin-top:6px; display:flex; align-items:center; gap:6px; justify-content:space-between; }
    .status-success { color:#10b981; } .status-error { color:#ff6b6b; } .status-uploading { color:var(--muted); }
    .upload-cancel-btn { min-width:28px; min-height:28px; background:rgba(255,77,77,.2); border:1px solid rgba(255,77,77,.5); border-radius:6px; cursor:pointer; color:#ff6b6b; display:flex; align-items:center; justify-content:center; }
    .upload-controls { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
    #clearCompletedBtn, #cancelAllBtn { min-height:30px; padding:.3rem .8rem; font-size:.75rem; border-radius:10px; background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.2); color:#fff; cursor:pointer; }

    #videoArea{ display:none; position:fixed; z-index:9998; overflow:hidden; border-radius:22px; border:1px solid var(--glass-border); background:linear-gradient(160deg, rgba(12,16,34,.86), rgba(6,10,25,.92)); backdrop-filter: blur(20px) saturate(170%); box-shadow:var(--shadow); flex-direction:column; }
    #videoArea.active{ display:flex; }
    #videoArea.pip{ width:min(44vw, 220px); aspect-ratio:3/4; max-height:40vh; right:14px; top:14px; }
    #videoArea.full{ inset:0; width:100%; height:100%; border-radius:0; border:none; }
    .video-stage{ position:relative; flex:1; min-height:0; }
    #remoteVideo{ width:100%; height:100%; object-fit:cover; background:#05070f; }
    #localVideo{ position:absolute; right:8px; top:8px; width:28%; max-width:120px; aspect-ratio:3/4; object-fit:cover; border-radius:12px; border:1px solid rgba(255,255,255,.35); background:#05070f; }
    #callStatus{ display:none; padding:.9rem 1rem .2rem; text-align:center; font-size:.9rem; font-weight:600; color:var(--accent); }
    #videoArea.audio-only #callStatus{ display:block; }
    #videoArea.audio-only .video-stage{ display:none; }
    #callControls{ display:flex; justify-content:center; gap:8px; padding:10px; }
    #callControls button{ min-width:42px; min-height:42px; border-radius:14px; border:none; background:rgba(255,255,255,.15); color:#fff; cursor:pointer; }
    .btn-danger { background: linear-gradient(135deg, #ff4d4d, #ff6b6b) !important; }

    #incomingCall{ display:none; position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:9999; padding:1.3rem; border-radius:20px; background:rgba(12,16,34,.95); border:1px solid var(--glass-border); backdrop-filter: blur(24px); }
    #callerInfo{ margin-bottom:1rem; font-weight:600; color:var(--accent); text-align:center; }
    .incoming-call-buttons { display: flex; justify-content:center; gap: 15px; }
    .call-btn { width:50px; height:50px; border-radius: 50%; display:flex; align-items:center; justify-content:center; font-size:1.2rem; border:none; color:#fff; cursor:pointer; }
    .call-accept { background: #10b981; }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="top-bar">
      <h2>🌸 Private Chat</h2>
      <button class="theme-toggle" onclick="toggleTheme()" id="theme-icon">🌙</button>
    </div>

    <div id="onlineInfo">
      <strong>🟢 Online: <span id="onlineCount">0</span></strong>
      <details>
        <summary>Show Online Users</summary>
        <ul id="userList"></ul>
      </details>
    </div>

    <div id="messages"></div>
    
    <div id="progressContainer">
      <div id="uploadsList"></div>
      <div class="upload-controls">
        <button id="cancelAllBtn" onclick="cancelAllUploads()" style="display:none;"><i class="fas fa-times"></i> Cancel All</button>
        <button id="clearCompletedBtn" onclick="clearCompletedUploads()" style="display:none;"><i class="fas fa-check"></i> Clear Completed</button>
      </div>
    </div>

    <div class="composer">
      <div class="input-row">
        <input type="text" id="messageInput" placeholder="Message..." autocomplete="off" />
        <button id="sendBtn" type="button" onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
      </div>
      <div class="action-row">
        <label for="file" title="Attach Files"><i class="fas fa-paperclip"></i><span class="btn-label">Upload</span></label>
        <button id="voiceCallBtn" onclick="startCall(false)"><i class="fas fa-phone"></i><span class="btn-label">Voice</span></button>
        <button id="videoCallBtn" onclick="startCall(true)"><i class="fas fa-video"></i><span class="btn-label">Video</span></button>
      </div>
      <input type="file" id="file" multiple />
    </div>
  </div>

  <div id="videoArea" class="pip">
    <p id="callStatus">🔊 Voice call in progress…</p>
    <div class="video-stage">
      <video id="remoteVideo" autoplay playsinline></video>
      <video id="localVideo" muted autoplay playsinline></video>
    </div>
    <div id="callControls">
      <button onclick="toggleMute()"><i id="micIcon" class="fas fa-microphone"></i></button>
      <button onclick="toggleCamera()"><i id="camIcon" class="fas fa-video"></i></button>
      <button onclick="toggleCallView()"><i id="viewIcon" class="fas fa-expand"></i></button>
      <button onclick="endCall()" class="btn-danger"><i class="fas fa-phone-slash"></i></button>
    </div>
  </div>

  <div id="incomingCall">
    <p id="callerInfo"><span id="callerName">Incoming Call</span></p>
    <div class="incoming-call-buttons">
      <button class="call-btn call-accept" onclick="acceptCall()"><i id="acceptIcon" class="fas fa-phone"></i></button>
      <button class="call-btn btn-danger" onclick="rejectCall()"><i class="fas fa-phone-slash"></i></button>
    </div>
  </div>

  <script>
    const socket = io({ reconnection: true, transports: ['websocket', 'polling'] });

    const username = localStorage.getItem("chat_username") || "Guest";
    const room = localStorage.getItem("chat_room") || "default";
    const messages = document.getElementById("messages");
    
    let currentUploads = new Map();
    let uploadCounter = 0;
    const MAX_FILE_SIZE = 50 * 1024 * 1024;
    let isCaller = false; 

    if (!username || !room || username === "Guest") window.location.href = "/";
    socket.emit("join", { username, room });

    function getFileNameFromUrl(url) { try { return url.split('/').pop().split('?')[0]; } catch (e) { return "File"; } }
    function getFileExtension(filename) { const match = filename.match(/\.([a-z0-9]+)(\?.*)?$/i); return match ? match[1].toLowerCase() : ''; }

    // FILE UPLOAD HANDLER
    document.getElementById("file").addEventListener("change", function() {
      const files = Array.from(this.files);
      if (!files.length) return;
      document.getElementById("progressContainer").style.display = "block";

      files.forEach(file => {
        const uploadId = ++uploadCounter;
        if (file.size > MAX_FILE_SIZE) {
          addUploadItem(uploadId, file.name, "error", `Max size 50MB`);
          setTimeout(() => removeUploadItem(uploadId), 3000); 
          return;
        }
        addUploadItem(uploadId, file.name, "uploading"); 
        uploadFile(file, uploadId);
      });
      this.value = "";
    });

    function addUploadItem(id, name, status, errorMsg = "") {
      const container = document.getElementById("uploadsList");
      let item = document.getElementById(`upload-${id}`);
      if (!item) { item = document.createElement("div"); item.id = `upload-${id}`; item.className = "upload-item"; container.appendChild(item); }

      const prev = currentUploads.get(id) || {};
      let shownPercent = typeof prev.percent === "number" ? prev.percent : 0;
      if (status === "success") shownPercent = 100;

      let html = `<div class="upload-info"><span class="upload-name">${name}</span><span class="upload-percent" id="percent-${id}">${shownPercent}%</span></div>`;
      if (status === "uploading") {
        html += `<div class="progress-bar-wrapper"><div class="progress-bar" id="bar-${id}" style="width:${shownPercent}%"></div></div>
                 <div class="upload-status status-uploading"><span>Uploading...</span>
                 <button class="upload-cancel-btn" onclick="cancelSingleUpload(${id})"><i class="fas fa-times"></i></button></div>`;
      } else if (status === "success") {
        html += `<div class="progress-bar-wrapper"><div class="progress-bar" id="bar-${id}" style="width:100%"></div></div>
                 <div class="upload-status status-success"><span>Uploaded successfully</span></div>`;
      } else {
        html += `<div class="upload-status status-error"><span>${errorMsg}</span></div>`;
      }
      item.innerHTML = html;
      currentUploads.set(id, { ...prev, xhr: status === "uploading" ? prev.xhr : undefined, status, percent: shownPercent, name });
      updateControlButtons();
    }

    function updateUploadProgress(id, percent) {
      const bar = document.getElementById(`bar-${id}`); 
      const percent_el = document.getElementById(`percent-${id}`);
      if (bar) bar.style.width = percent + "%"; 
      if (percent_el) percent_el.textContent = percent + "%";
      const entry = currentUploads.get(id); 
      if (entry) currentUploads.set(id, { ...entry, percent });
    }

    function removeUploadItem(id) {
      const item = document.getElementById(`upload-${id}`);
      if (item) {
        item.style.opacity = '0';
        setTimeout(() => { 
          item.remove(); 
          if (currentUploads.size === 0) { 
            document.getElementById("progressContainer").style.display = "none"; 
            document.getElementById("uploadsList").innerHTML = ""; 
          } 
        }, 300);
      }
      currentUploads.delete(id); 
      updateControlButtons();
    }

    function uploadFile(file, uploadId) {
      const formData = new FormData();
      formData.append("file", file); 
      formData.append("username", username); 
      formData.append("room", room);

      const xhr = new XMLHttpRequest();
      currentUploads.set(uploadId, { xhr, status: "uploading", percent: 0, name: file.name });

      xhr.upload.onprogress = (e) => { 
        if (e.lengthComputable) updateUploadProgress(uploadId, Math.round((e.loaded / e.total) * 100)); 
      };

      xhr.onload = () => {
        let data = null; 
        try { data = JSON.parse(xhr.responseText); } catch (e) {}

        if (xhr.status === 200 && data && data.url) {
          updateUploadProgress(uploadId, 100); 
          addUploadItem(uploadId, file.name, "success");
        } else { 
          addUploadItem(uploadId, file.name, "error", (data && data.error) ? data.error : "Upload failed"); 
        }
      };

      xhr.onerror = () => addUploadItem(uploadId, file.name, "error", "Network error");
      xhr.open("POST", "/upload", true); 
      xhr.send(formData);
    }

    function cancelSingleUpload(id) { 
      const u = currentUploads.get(id); 
      if (u && u.xhr && u.status === "uploading") u.xhr.abort(); 
      addUploadItem(id, u.name||"File", "error", "Cancelled"); 
      setTimeout(() => removeUploadItem(id), 1500); 
    }
    
    function cancelAllUploads() { 
      currentUploads.forEach((u, id) => { 
        if (u.xhr && u.status === "uploading") u.xhr.abort(); 
        addUploadItem(id, u.name||"File", "error", "Cancelled"); 
      }); 
      setTimeout(() => currentUploads.forEach((_, id) => removeUploadItem(id)), 1500); 
    }
    
    function clearCompletedUploads() { 
      currentUploads.forEach((u, id) => { 
        if (u.status === "success" || u.status === "error") removeUploadItem(id); 
      }); 
    }

    function updateControlButtons() {
      document.getElementById("cancelAllBtn").style.display = Array.from(currentUploads.values()).some(u => u.status === "uploading") ? "inline-block" : "none";
      document.getElementById("clearCompletedBtn").style.display = Array.from(currentUploads.values()).some(u => u.status === "success" || u.status === "error") ? "inline-block" : "none";
    }

    socket.on("update_user_list", (data) => {
      const userList = document.getElementById("userList"); 
      userList.innerHTML = "";
      data.users.forEach(user => {
        const li = document.createElement("li"); 
        li.textContent = user;
        if (user === username) li.classList.add("current-user"); 
        userList.appendChild(li);
      });
      document.getElementById("onlineCount").textContent = data.count;
    });

    socket.on("message", data => {
      const div = document.createElement("div"); 
      const msg = data.message; 
      let formattedMessage = "";

      const isUploadedFile = typeof msg === "string" && (msg.startsWith("/") || msg.startsWith("http")) && msg.includes("/uploads/");
      const extension = getFileExtension(msg); 
      const fileName = getFileNameFromUrl(msg);

      if (isUploadedFile) {
        if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(extension)) { 
          formattedMessage = `<img src="${msg}" onclick="window.open('${msg}','_blank')">`; 
        } 
        else if (['mp4', 'webm', 'mov'].includes(extension)) { 
          formattedMessage = `<video controls playsinline><source src="${msg}"></video>`; 
        } 
        else if (['mp3', 'wav', 'ogg', 'aac', 'm4a'].includes(extension)) { 
          formattedMessage = `<audio controls preload="metadata"><source src="${msg}"></audio><div style="font-size:.75rem;margin-top:4px;">🎵 <a href="${msg}" download="${fileName}" class="shared-link">${fileName}</a></div>`; 
        } 
        else { 
          formattedMessage = `📁 File: <a href="${msg}" download="${fileName}" class="shared-link">${fileName}</a>`; 
        }
      } else if (typeof msg === "string" && msg.startsWith("http")) { 
        formattedMessage = `<a href="${msg}" target="_blank" class="shared-link">${msg}</a>`; 
      } else { 
        formattedMessage = msg.replace(/(https?:\/\/[^\s]+)/g, (url) => `<a href="${url}" target="_blank" class="shared-link">${url}</a>`); 
      }

      if (data.username === "System") { 
        div.className = "system-msg"; 
        div.innerHTML = formattedMessage; 
      } else { 
        div.className = "msg"; 
        div.innerHTML = `<strong>${data.username}</strong>:<div class="msg-content">${formattedMessage}</div>`; 
      }

      messages.appendChild(div); 
      messages.scrollTop = messages.scrollHeight;
    });

    function sendMessage() {
      const msg = document.getElementById("messageInput").value.trim(); 
      if (!msg) return;
      socket.emit("message", { username, room, message: msg });
      document.getElementById("messageInput").value = "";
    }

    document.getElementById("messageInput").addEventListener("keypress", (e) => { 
      if (e.key === "Enter") sendMessage(); 
    });

    function toggleTheme() {
      document.body.classList.toggle("dark-mode");
      document.getElementById("theme-icon").textContent = document.body.classList.contains("dark-mode") ? "☀️" : "🌙";
    }

    // WEBRTC CALL SYSTEM
    let localStream = null; 
    let peerConnection = null; 
    let isVideoCall = false; 
    let isMuted = false;
    let pendingCandidates = [];

    function setCallUI(active, video) {
      const area = document.getElementById("videoArea"); 
      area.classList.toggle("active", active); 
      area.classList.toggle("audio-only", active && !video);
      document.getElementById("camIcon").parentElement.style.display = video ? "inline-block" : "none";
      if (!active) { area.classList.remove("full"); area.classList.add("pip"); }
      const statusEl = document.getElementById("callStatus"); 
      if (statusEl && active) statusEl.innerHTML = video ? "🎥 Video call…" : "🔊 Voice call…";
    }

    function toggleCallView() { 
      const area = document.getElementById("videoArea"); 
      area.classList.toggle("full"); 
      area.classList.toggle("pip"); 
    }

    function startCall(video) {
      if (peerConnection || document.getElementById("videoArea").classList.contains("active")) return;
      isVideoCall = video; isCaller = true; setCallUI(true, video);

      navigator.mediaDevices.getUserMedia({ audio: true, video: video }).then(stream => {
        localStream = stream; 
        document.getElementById("localVideo").srcObject = stream;
        peerConnection = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
        
        peerConnection.onicecandidate = e => { if (e.candidate) socket.emit("ice-candidate", { candidate: e.candidate, room }); };
        peerConnection.ontrack = e => document.getElementById("remoteVideo").srcObject = e.streams[0];
        stream.getTracks().forEach(track => peerConnection.addTrack(track, stream));
        
        peerConnection.createOffer().then(offer => {
          peerConnection.setLocalDescription(offer);
          socket.emit("offer", { offer, username, room, video });
        });
      }).catch(err => setCallUI(false, false));
    }

    socket.on("offer", ({ offer, username: caller, video }) => {
      if (document.getElementById("videoArea").classList.contains("active") || peerConnection) { 
        socket.emit("reject-call", { username, room }); 
        return; 
      }
      isVideoCall = video; window.pendingOffer = offer; isCaller = false; pendingCandidates = [];
      document.getElementById("callerName").textContent = `${caller} is calling...`;
      document.getElementById("incomingCall").style.display = "block";
    });

    function acceptCall() {
      document.getElementById("incomingCall").style.display = "none";
      navigator.mediaDevices.getUserMedia({ audio: true, video: isVideoCall }).then(stream => {
        localStream = stream; 
        document.getElementById("localVideo").srcObject = stream;
        peerConnection = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });
        
        peerConnection.onicecandidate = e => { if (e.candidate) socket.emit("ice-candidate", { candidate: e.candidate, room }); };
        peerConnection.ontrack = e => document.getElementById("remoteVideo").srcObject = e.streams[0];
        stream.getTracks().forEach(track => peerConnection.addTrack(track, stream));
        
        peerConnection.setRemoteDescription(new RTCSessionDescription(window.pendingOffer)).then(() => {
          pendingCandidates.forEach(c => peerConnection.addIceCandidate(new RTCIceCandidate(c)).catch(e=>console.error(e)));
          pendingCandidates = [];
          return peerConnection.createAnswer();
        }).then(answer => {
          peerConnection.setLocalDescription(answer);
          socket.emit("answer", { answer, room });
        });
        setCallUI(true, isVideoCall);
      });
    }

    function rejectCall() { 
      document.getElementById("incomingCall").style.display = "none"; 
      socket.emit("reject-call", { username, room }); 
      cleanupCallStates(); 
    }

    socket.on("answer", ({ answer }) => {
      if (peerConnection && peerConnection.signalingState !== "stable") {
        peerConnection.setRemoteDescription(new RTCSessionDescription(answer)).then(() => {
          pendingCandidates.forEach(c => peerConnection.addIceCandidate(new RTCIceCandidate(c)).catch(e=>console.error(e)));
          pendingCandidates = [];
        });
      }
    });

    socket.on("ice-candidate", ({ candidate }) => {
      if (peerConnection && peerConnection.remoteDescription && peerConnection.remoteDescription.type) {
        peerConnection.addIceCandidate(new RTCIceCandidate(candidate)).catch(e => console.error(e));
      } else {
        pendingCandidates.push(candidate);
      }
    });

    function toggleMute() { 
      if(localStream){ 
        isMuted = !isMuted; 
        localStream.getAudioTracks()[0].enabled = !isMuted; 
        document.getElementById("micIcon").className = isMuted ? "fas fa-microphone-slash" : "fas fa-microphone"; 
      } 
    }
    
    function toggleCamera() { 
      if(localStream && localStream.getVideoTracks().length){ 
        const isCamOn = localStream.getVideoTracks()[0].enabled; 
        localStream.getVideoTracks()[0].enabled = !isCamOn; 
        document.getElementById("camIcon").className = !isCamOn ? "fas fa-video" : "fas fa-video-slash"; 
      } 
    }

    function cleanupCallStates() {
      if (peerConnection) { peerConnection.close(); peerConnection = null; }
      if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
      document.getElementById("remoteVideo").srcObject = null; 
      document.getElementById("localVideo").srcObject = null; 
      document.getElementById("incomingCall").style.display = "none";
      setCallUI(false, false); 
      isMuted = false; 
      isVideoCall = false; 
      isCaller = false; 
      window.pendingOffer = null; 
      pendingCandidates = [];
    }

    function endCall() { socket.emit("call-ended", { username, room }); cleanupCallStates(); }
    socket.on("call-ended", cleanupCallStates);
    socket.on("call-rejected", cleanupCallStates);
  </script>
</body>
</html>
