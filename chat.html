<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Private Chat</title>
  <script src="https://unpkg.com/feather-icons"></script>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="dark-mode">
  <div class="chat-container">
    <header class="chat-header">
      <div class="title">
        <i data-feather="flower"></i>
        <h2>Private Chat</h2>
      </div>
      <button id="theme-toggle" class="icon-btn">
        <i data-feather="sun" id="theme-icon"></i>
      </button>
    </header>

    <section class="online-status">
      <div class="status-indicator">
        <span class="dot green"></span>
        <span>Online: <strong id="online-count">0</strong></span>
      </div>
      <button id="toggle-users-btn" class="text-btn">
        <i data-feather="chevron-down" id="arrow-icon"></i>
        <span>Show Online Users</span>
      </button>
      <div id="users-list" class="users-list hidden"></div>
    </section>

    <section id="chat-messages" class="chat-messages"></section>

    <footer class="chat-footer">
      <div class="input-wrapper">
        <input type="text" placeholder="Message..." id="message-input" />
        <button id="send-btn" class="send-btn"><i data-feather="send"></i></button>
      </div>
      <div class="media-actions">
        <input type="file" id="file-input" style="display: none;" />
        <button id="upload-btn" class="action-btn"><i data-feather="paperclip"></i> Upload</button>
        <button id="voice-btn" class="action-btn"><i data-feather="phone"></i> Voice</button>
        <button id="video-btn" class="action-btn"><i data-feather="video"></i> Video</button>
      </div>
    </footer>
  </div>

  <!-- Draggable / Fullscreen Call Overlay -->
  <div id="call-popup" class="call-popup">
    <div class="video-preview">
      <div id="remote-video" class="remote-video"></div>
      <div id="local-video" class="local-video"></div>
    </div>
    <div class="call-controls">
      <button class="call-btn"><i data-feather="mic"></i></button>
      <button class="call-btn"><i data-feather="video-off"></i></button>
      <button id="fullscreen-btn" class="call-btn"><i data-feather="maximize-2" id="fs-icon"></i></button>
      <button id="end-call-btn" class="call-btn end-call"><i data-feather="phone-off"></i></button>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script src="/static/script.js"></script>
</body>
</html>
